apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: catalogue-backend:Node01
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_URI
              value: "mongodb://admin:secret@mongodb:27017/catalogue_films?authSource=admin"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: TMDB_API_KEY
              value: "1c9021903828653d94a867a5af5db8da"
            - name: PORT
              value: "8000"
